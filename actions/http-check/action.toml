schema = 1
description = "Fetch one HTTPS URL and fail unless it returns the expected status."
environment = "net-tools"
help = """
A template: it cannot be requested itself. Under Administration → Templates,
make one action from it per URL, such as http-check-www, and give it the
server, port and path. Then grant that action the same host and port under
Settings → Run destinations by action; until then its page warns that it
cannot reach the server. A server with a private address needs the grant to
pin its "ip".

The run fetches https://SERVER:PORT/PATH through Chancery's egress proxy,
verifying the certificate, and reports the status, timing and size. The URL
is built only from the action's configuration, so a requester cannot point it
anywhere else. Only HTTPS is used, and redirects are reported rather than
followed: a redirect to another host would need its own grant, so point the
action at the final URL instead.

A real catalog might check the response body, send an authentication header
from a secret, or check a health endpoint after a deploy.
"""

[[config]]
name = "server"
type = "host"
description = "Server to fetch from."

[[config]]
name = "port"
type = "integer"
min = 1
max = 65535
default = 443
description = "HTTPS port on the server."

[[config]]
name = "path"
type = "string"
pattern = '^/[A-Za-z0-9._~%/?&=+,:@-]*$'
max_length = 512
default = "/"
description = "Path and query to fetch, starting with /."

[[config]]
name = "expect_status"
type = "integer"
min = 100
max = 599
default = 200
description = "HTTP status the response must have."

[run]
script = "run.sh"
timeout = "1m"
